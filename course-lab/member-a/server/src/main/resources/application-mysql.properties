# Activate with --spring.profiles.active=mysql. This replaces H2; it is not a second database.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wardrobe?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:wardrobe}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
